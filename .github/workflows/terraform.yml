name: 'Terraform CI'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform Validation'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Format Check
      run: terraform fmt -check

    - name: Terraform Init
      # backend=false previene la necesidad de inyectar llaves secretas de Azure solo para validaciones sintácticas básicas
      run: terraform init -backend=false 

    - name: Terraform Validate
      run: terraform validate